
services:
  nova_server:
    build: .
    container_name: nova_core
    restart: unless-stopped   # auto-launches when the host boots / Docker daemon starts
    ports:
      - "8000:8000"
      - "8080:8080" # Maps local OAuth callback
    volumes:
      # Mount models from host machine so multi-GB GGUF/ONNX weights are
      # never baked into the image.
      - ./models:/app/models
      # Live-edit the web dashboard without rebuilding the image.
      - ./web_ui:/app/web_ui:ro
      # Persistent databases (SQLite core store + ChromaDB vector store)
      - ./data:/app/data
      # Mount local projects (read-only) so NOVA can inspect/ingest them,
      # e.g. your Flutter app source trees.
      - ${NOVA_HOST_PROJECTS_PATH:-./host_projects}:/app/host_projects:ro
      
      - ./models/sentence_transformers_cache:/root/.cache/torch/sentence_transformers
      
      - ./persistent_memory:/app/persistent_memory

      - ./tests:/app/tests:ro
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - OMP_NUM_THREADS=${NOVA_THREADS:-4} # utilize all 4 cores of a Ryzen 3
      - NOVA_HOST_PROJECTS_DIR=/app/host_projects
      - NOVA_OFFLINE=${NOVA_OFFLINE:-1}
      - HF_HUB_OFFLINE=${NOVA_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${NOVA_OFFLINE:-1}
      - HF_HUB_DISABLE_TELEMETRY=1
      - ANONYMIZED_TELEMETRY=False
    deploy:
      resources:
        limits:
          memory: ${NOVA_MEM_LIMIT:-8g} # cap RAM so the host OS never crashes
    ulimits:
      memlock:
        soft: -1
        hard: -1
    cap_add:
      - IPC_LOCK
    networks:
      - nova-net

networks:
  nova-net:
    external: true
