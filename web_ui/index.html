<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA // System Control</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- HUD Header Bar -->
    <header class="hud-header">
        <div class="brand-title">
            <span class="status-dot" id="statusDot"></span>
            NOVA <span class="status-label" id="statusLabel">CONNECTING...</span>
        </div>

        <div class="telemetry-panel">
            <div class="stat-item">BRAIN: <strong id="statBrain">-</strong></div>
            <div class="stat-item">STT: <strong id="statStt">-</strong></div>
            <div class="stat-item">TTS: <strong id="statTts">-</strong></div>
            <div class="stat-item">SPEED: <strong id="statTokensPerSecond">0.0 tok/s</strong></div>
            <div class="stat-item">
                <select id="modelSelect" class="model-select" disabled></select>
            </div>
        </div>
    </header>

    <!-- Center Visualizer Core -->
    <main id="coreWrapper" class="core-wrapper">
        <canvas id="orbCanvas" width="480" height="480"></canvas>
    </main>

    <!-- Floating HUD Command Bar -->
    <div class="hud-controls">
        <button id="micBtn" class="hud-btn" title="Hold to Talk">🎙 Mic</button>
        <input type="text" id="userInput" class="hud-input" placeholder="Initiate command sequence..." onkeydown="if(event.key==='Enter') sendMsg()" />
        <button class="hud-btn" onclick="sendMsg()">Send</button>
        <button class="hud-btn" onclick="toggleDrawer()">Backlog</button>
        <button class="hud-btn" onclick="toggleMemoryMap()">Preferences Map</button>
    </div>

    <div id="memoryMapPanel" class="memory-map-panel hidden">
        <div class="memory-map-header">
            <span>// LOCAL PREFERENCES MAP</span>
            <button class="hud-btn small" onclick="memoryGraphFocus = null; renderMemoryMap();">Root</button>
            <button class="hud-btn small" onclick="toggleMemoryMap()">Close</button>
        </div>
        <svg id="memoryMapSvg" class="memory-map-svg" viewBox="0 0 1000 720" preserveAspectRatio="xMidYMid meet"></svg>
        <aside id="memoryNoteViewer" class="memory-note-viewer hidden" aria-live="polite"></aside>
    </div>

    <!-- Hidden Conversation Backlog Drawer -->
    <aside class="backlog-drawer" id="drawer">
        <div class="drawer-header">
            <span>// CONVERSATION BACKLOG</span>
            <span class="close-btn" onclick="toggleDrawer()">✕</span>
        </div>
        <div id="chat-box" class="chat-box"></div>
    </aside>

    <script src="/static/app.js"></script>
</body>
</html>
